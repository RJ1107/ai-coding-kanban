<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Workboard</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="booting">
  <canvas id="field" aria-hidden="true"></canvas>
  <div id="boot" aria-hidden="true"><span>WORKBOARD</span><i></i></div>

  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 2.5a9.5 9.5 0 0 1 8.2 4.7"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>Workboard</span>
    </div>
    <label class="project-switch"><span class="sr">Project</span><select id="project"></select></label>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="bar-actions">
      <span class="link" id="connection" role="status">Connecting</span>
      <button class="ghost" id="handoff" title="Copy a Markdown summary for a teammate or the next assistant">Copy handoff</button>
      <button class="cta" id="new-task">Add task</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="ghost-count" id="ghost" aria-hidden="true"></div>
      <div class="hero-copy">
        <p class="kicker" id="kicker"></p>
        <h1 id="title"></h1>
        <p class="goal" id="goal"></p>
        <div class="agents" id="agents" aria-label="Owners"></div>
      </div>
      <div class="orbit"><svg id="orbit" viewBox="0 0 320 320" role="img" aria-label="Task progress"></svg></div>
    </section>

    <section class="focus" id="focus" aria-label="Current focus">
      <div class="focus-main">
        <p class="focus-label" id="focus-label"></p>
        <strong id="focus-title"></strong>
        <p class="focus-note" id="focus-note"></p>
      </div>
      <div class="focus-side">
        <span class="clock" id="focus-clock"></span>
        <span class="focus-meta" id="focus-meta"></span>
      </div>
    </section>

    <div class="deck">
      <section class="board" id="board" aria-label="Task board"></section>
      <aside class="activity" aria-label="Activity">
        <h2>Activity <span id="revision"></span></h2>
        <ol id="events"></ol>
      </aside>
    </div>

    <footer>Progress is reported by your coding assistant. The link status describes this board service, not the model.</footer>
  </main>

  <div id="toast" role="alert" hidden></div>

  <dialog id="detail" class="drawer">
    <form id="detail-form">
      <div class="dialog-top"><span class="kicker" id="detail-id"></span><button type="button" class="close" data-close="detail" aria-label="Close">×</button></div>
      <p class="stale-hint" id="detail-stale" hidden>This card changed after you opened it. Close and reopen it to edit the latest version.</p>
      <label><span>Title</span><input id="detail-title" required maxlength="180" autocomplete="off"></label>
      <div class="field"><span>Status</span><div class="status-pick" id="detail-status" role="radiogroup" aria-label="Status"></div></div>
      <label><span>Owner</span><input id="detail-owner" required maxlength="80" autocomplete="off"></label>
      <label><span>Latest progress / next step</span><textarea id="detail-note" rows="4" maxlength="2000"></textarea></label>
      <label><span>Results and verification</span><textarea id="detail-evidence" rows="4" maxlength="4000"></textarea></label>
      <div class="dialog-actions"><button type="button" class="ghost" data-close="detail">Cancel</button><button class="cta">Save changes</button></div>
      <div class="history"><h3>Card history</h3><ol id="task-history"></ol></div>
    </form>
  </dialog>

  <dialog id="create">
    <form id="create-form">
      <div class="dialog-top"><h2 id="create-heading"></h2><button type="button" class="close" data-close="create" aria-label="Close">×</button></div>
      <label><span>Title</span><input id="create-title" required maxlength="160" autocomplete="off"></label>
      <label><span id="create-note-label"></span><textarea id="create-note" rows="3" maxlength="2000"></textarea></label>
      <div class="dialog-actions"><button type="button" class="ghost" data-close="create">Cancel</button><button class="cta">Create</button></div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
